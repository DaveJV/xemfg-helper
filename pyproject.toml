[project]
name = "xemfg-helper"
version = "0.1.0"
description = "Install and maintain XeMFG (MFG Unlocker + dashdogy OptiScaler) for Proton games on Linux"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "DaveJV" }]
dependencies = [
    "typer>=0.12",
    "textual>=0.80",
    "pefile>=2023.2.7",
    "rapidfuzz>=3.0",
    "httpx>=0.27",
    "tomli-w>=1.0",
]

[project.scripts]
xemfg = "xemfg.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xemfg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
